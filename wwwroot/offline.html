<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão | Match-Pet SP</title>
    <meta name="theme-color" content="#2563eb" />
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f6f8fc; color: #334155; text-align: center; padding: 1.5rem; box-sizing: border-box; }
        @media (prefers-color-scheme: dark) { body { background: #0b1220; color: #cbd5e1; } h1 { color: #f1f5f9 !important; } }
        img { width: 96px; height: 96px; border-radius: 24px; }
        h1 { color: #0f172a; font-size: 1.4rem; margin: 1rem 0 .5rem; }
        button { margin-top: 1.25rem; background: #2563eb; color: #fff; border: 0; border-radius: 12px; padding: .8rem 1.4rem; font-weight: 700; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/icones/app-192.png" alt="" />
        <h1>Você está sem internet 🐾</h1>
        <p>O Match-Pet precisa de conexão para mostrar os pets e as conversas.<br />Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
        <button onclick="location.reload()">Tentar novamente</button>
    </main>

</html>
